services:
  - type: web
    name: son-designs
    runtime: node
    repo: https://github.com/johnleshan/Son-Designs.git
    plan: free
    branch: main
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    autoDeploy: true
    healthCheckPath: /
    envVars:
      - key: NODE_VERSION
        value: "24"
      - key: NODE_ENV
        value: production